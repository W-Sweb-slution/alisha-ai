<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b17"><title>Sign in · Alisha AI</title><link rel="stylesheet" href="/auth.css"></head><body><div class="auth-backdrop" aria-hidden="true"><i></i><i></i><i></i></div><main class="auth-shell"><a class="brand" href="/login" aria-label="Alisha AI"><span class="brand-mark">✦</span><span>ALISHA AI</span></a><section class="auth-card"><div class="eyebrow">YOUR SOCIAL CONTENT STUDIO</div><h1 id="authHeading">Welcome back</h1><p class="subtitle" id="authSubheading">Sign in to continue to Alisha AI.</p><div class="auth-message error" id="authError" role="alert" hidden></div><div class="auth-message success" id="authSuccess" role="status" hidden></div><form id="authForm" novalidate><div class="field" id="nameField"><label for="fullName">Full name</label><input id="fullName" name="fullName" type="text" autocomplete="name" maxlength="100" placeholder="Your name"></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required></div><div class="field"><label for="password">Password</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" data-toggle-password="password" aria-label="Show password">Show</button></div><small id="passwordHelp">At least 10 characters, with uppercase, lowercase, a number, and a symbol.</small></div><div class="field" id="confirmField"><label for="confirmPassword">Confirm password</label><div class="password-wrap"><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password"><button type="button" data-toggle-password="confirmPassword" aria-label="Show password">Show</button></div></div><button class="submit" id="authSubmit" type="submit">Sign in</button></form><p class="auth-switch" id="authSwitch"></p><p class="privacy">Your password is securely hashed. Alisha never stores it in your browser.</p></section><footer>Secure access to your Alisha workspace</footer></main><script src="/auth.js" defer></script></body></html>
